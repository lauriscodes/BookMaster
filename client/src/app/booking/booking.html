<p-stepper [value]="1">
  <p-step-list>
    <p-step [value]="1">Basic info</p-step>
    <p-step [value]="2">Date/Time</p-step>
    <p-step (click)="getRooms()" [value]="3">Room</p-step>
  </p-step-list>
  <p-step-panels>
    <p-step-panel [value]="1">
      <ng-template #content>
        <div class="container">
          <div class="control">
            <label for="name">Name</label>
            <input [(ngModel)]="name" fluid id="name" pInputText/>
          </div>
          <div class="control">
            <label for="email">Email</label>
            <input [(ngModel)]="email" fluid id="email" pInputText/>
          </div>
        </div>
      </ng-template>
    </p-step-panel>
    <p-step-panel [value]="2">
      <ng-template #content>
        <div class="date-container">
          <p-datepicker [(ngModel)]="date" [inline]="true"/>
          <p-selectbutton
            [(ngModel)]="time" [options]="slots()"
          />
        </div>
      </ng-template>
    </p-step-panel>
    <p-step-panel [value]="3">
      <ng-template #content>
        <div class="control">
          <label>Room no</label>
          <p-select [(ngModel)]="room" [options]="rooms()"/>
        </div>
        @if (msg()) {
          <p-message>{{ msg() }}</p-message>
        } @else {
          <div class="action">
            <p-button (click)="save()" label="Save" size="small"/>
          </div>
        }
      </ng-template>
    </p-step-panel>
  </p-step-panels>
</p-stepper>
